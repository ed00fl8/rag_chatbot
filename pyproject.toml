[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "1.0.0"
description = "Local document-grounded RAG assistant with hybrid retrieval and reranking"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=4,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
